name: CI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v2
      
      - name: Setup dotnet
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.x'

      - name: Get version
        id: version
        run: echo "version-without-v=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Publish Json Nuget Package
        id: publish_nuget_json
        uses: cardboards-box/publish-nuget@v1.0.0
        with:
          PROJECT_FILE_PATH: src/CardboardBox.Json/CardboardBox.Json.csproj
          TAG_COMMIT: true
          VERSION_STATIC: ${{ steps.version.outputs.version-without-v }}

      - name: Publish Newtonsoft Json Nuget Package
        id: publish_nuget_json_newtonsoft
        uses: cardboards-box/publish-nuget@v1.0.0
        with:
          PROJECT_FILE_PATH: src/CardboardBox.Json.Newtonsoft/CardboardBox.Json.Newtonsoft.csproj
          TAG_COMMIT: false
          VERSION_STATIC: ${{ steps.version.outputs.version-without-v }}
          
      - name: Publish Http Nuget Package
        id: publish_nuget_http
        uses: cardboards-box/publish-nuget@v1.0.0
        with:
          PROJECT_FILE_PATH: src/CardboardBox.Http/CardboardBox.Http.csproj
          TAG_COMMIT: false
          VERSION_STATIC: ${{ steps.version.outputs.version-without-v }}
          
      - name: Publish Http Files Nuget Package
        id: publish_nuget_http_files
        uses: cardboards-box/publish-nuget@v1.0.0
        with:
          PROJECT_FILE_PATH: src/CardboardBox.Http.Files/CardboardBox.Http.Files.csproj
          TAG_COMMIT: false
          VERSION_STATIC: ${{ steps.version.outputs.version-without-v }}
          
      - name: Publish Http Html Nuget Package
        id: publish_nuget_http_html
        uses: cardboards-box/publish-nuget@v1.0.0
        with:
          PROJECT_FILE_PATH: src/CardboardBox.Http.Html/CardboardBox.Http.Html.csproj
          TAG_COMMIT: false
          VERSION_STATIC: ${{ steps.version.outputs.version-without-v }}
          
      - name: Publish Http Handlers Nuget Package
        id: publish_nuget_http_handlers
        uses: cardboards-box/publish-nuget@v1.0.0
        with:
          PROJECT_FILE_PATH: src/CardboardBox.Http.Handlers/CardboardBox.Http.Handlers.csproj
          TAG_COMMIT: false
          VERSION_STATIC: ${{ steps.version.outputs.version-without-v }}